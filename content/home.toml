[[faq]]
q = "Нам нужен СТ-1 или акт ТПП?"
a = "Зависит от кода ОКПД2. Если продукция есть в приложении к ПП №719, нужен акт экспертизы ТПП с баллами, если нет – сертификат СТ-1. Определим на бесплатном аудите."
[[faq]]
q = "Что изменилось после ПП №1026?"
a = "С 01.01.2027 одежда для спортсменов, нательное бельё, чулочно-носочные изделия, сумки и рюкзаки, пледы, спальные мешки и шторы подтверждаются актом ТПП с баллами, а не СТ-1. Записи по СТ-1 на эти позиции с этой даты перестают работать."
[[faq]]
q = "Продукции нет в каталоге ГИСП. Что делать?"
a = "Сначала разместить её в каталоге: заявка в ТПП собирается из позиций каталога, а ошибку в опубликованной карточке быстро не исправить, правка снова уходит на модерацию. Подготовим и загрузим карточки, проверим коды ОКПД2 и ТН ВЭД. С модерацией это до 4 недель."
[[faq]]
q = "Сколько действует запись?"
a = "На основании СТ-1 – 3 года, на основании акта ТПП – до 5 лет."
[[faq]]
q = "Можно ли без собственной фабрики?"
a = "Да, в том числе при контрактном производстве. Запись оформляется на компанию, которая владеет технической документацией и организует выпуск продукции на площадке контрагента в России. Нельзя оформить готовый товар, купленный для перепродажи, или продукцию, изготовленную за рубежом."
[[faq]]
q = "Сколько это стоит?"
a = "Под ключ: СТ-1 – от 140 000 ₽, акт ТПП – от 180 000 ₽, отдельный этап – от 40 000 ₽. Услуги ТПП оплачиваются отдельно: заказчик заключает договор с палатой и платит ей напрямую."
[[faq]]
q = "Вы гарантируете результат?"
a = "Решение принимают ТПП и Минпромторг. Мы отвечаем за правильность и полноту пакета документов и соблюдение сроков со своей стороны."
[[faq]]
q = "Какие документы понадобятся?"
a = "Регистрационные документы, документы на площадку и оборудование, технологическая документация, перечень операций и материалов. Обзор – на странице «Документы», полный чек-лист под вашу продукцию – после экспресс-аудита."
